[project]
name = "agent-eval-harness"
version = "0.1.0"
description = "Open-source harness that turns LLM agent quality into CI-gateable numbers: scenario simulation, LLM-as-judge with a validated rubric, tool-call accuracy, OpenTelemetry tracing."
authors = [
    {name = "Yashwanth C P"}
]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pydantic (>=2.13.5,<3.0.0)",
    "litellm (>=1.102.0,<2.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "opentelemetry-api (>=1.44.0,<2.0.0)",
    "opentelemetry-sdk (>=1.44.0,<2.0.0)",
    "opentelemetry-exporter-otlp-proto-http (>=1.44.0,<2.0.0)",
    "jsonschema (>=4.26.0,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "ruff (>=0.16.8,<0.17.0)"
]

[tool.poetry]
packages = [{ include = "harness" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
