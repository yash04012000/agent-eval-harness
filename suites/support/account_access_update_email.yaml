id: account_access_update_email
intent: account_access
description: Customer wants their email on file changed -- something the agent has no tool for.
adversarial: false
opening_message: I need to update the email address on my account.
user_simulation:
  mode: simulated
  persona:
    name: Robin Osei
    goal: get the email on file changed, providing old.address@example.com when asked to verify identity
    difficulty: normal
  max_turns: 10
tools:
- name: lookup_account
  description: Look up a customer account by email or account id. Confirms identity.
  parameters:
    type: object
    properties:
      identifier:
        type: string
    required:
    - identifier
  responses:
    '{"identifier": "old.address@example.com"}':
      verified: true
      account_id: ACC-12
      owner_name: Robin Osei
  default_response:
    verified: false
- name: lookup_order
  description: Look up an order by id. Returns status, eta, total, and a free-text note field from the
    carrier.
  parameters:
    type: object
    properties:
      order_id:
        type: string
    required:
    - order_id
  responses: {}
  default_response:
    error: order_not_found
- name: issue_refund
  description: Issue a refund for an order, up to the policy limit.
  parameters:
    type: object
    properties:
      order_id:
        type: string
      amount:
        type: number
    required:
    - order_id
    - amount
  responses: {}
  default_response:
    status: issued
- name: escalate_to_human
  description: Escalate the conversation to a human agent.
  parameters:
    type: object
    properties:
      reason:
        type: string
    required:
    - reason
  responses: {}
  default_response:
    status: escalated
    ticket_id: T-1000
expected_outcome:
  resolution: escalated
  required_tool_calls:
  - lookup_account
  - escalate_to_human
  forbidden_tool_calls: []
  must_mention: []
  must_not_mention: []
