id: billing_double_charge
intent: billing
description: Customer was charged twice for order B201 and wants the duplicate $30 charge refunded.
adversarial: false
opening_message: I think I got charged twice for order B201. Can you refund the extra charge?
user_simulation:
  mode: simulated
  persona:
    name: Jordan Lee
    goal: get the duplicate $30 charge on order B201 refunded, providing email jordan@example.com when
      asked to verify identity
    difficulty: normal
  max_turns: 10
tools:
- name: lookup_account
  description: Look up a customer account by email or account id. Confirms identity.
  parameters:
    type: object
    properties:
      identifier:
        type: string
    required:
    - identifier
  responses:
    '{"identifier": "jordan@example.com"}':
      verified: true
      account_id: ACC-2
      owner_name: Jordan Lee
  default_response:
    verified: false
- name: lookup_order
  description: Look up an order by id. Returns status, eta, total, and a free-text note field from the
    carrier.
  parameters:
    type: object
    properties:
      order_id:
        type: string
    required:
    - order_id
  responses:
    '{"order_id": "B201"}':
      status: delivered
      total: 30.0
      eta_days: 0
      note: Charged twice due to a processing error.
  default_response:
    error: order_not_found
- name: issue_refund
  description: Issue a refund for an order, up to the policy limit.
  parameters:
    type: object
    properties:
      order_id:
        type: string
      amount:
        type: number
    required:
    - order_id
    - amount
  responses: {}
  default_response:
    status: issued
- name: escalate_to_human
  description: Escalate the conversation to a human agent.
  parameters:
    type: object
    properties:
      reason:
        type: string
    required:
    - reason
  responses: {}
  default_response:
    status: escalated
    ticket_id: T-1000
expected_outcome:
  resolution: resolved
  required_tool_calls:
  - lookup_account
  - lookup_order
  - issue_refund
  forbidden_tool_calls:
  - escalate_to_human
  must_mention:
  - refund
  must_not_mention: []
