id: billing_overcharge_vague
intent: billing
description: A vague customer believes they were overcharged on order B204 but withholds details at first.
adversarial: false
opening_message: Hey, I think you guys charged me too much for something recently.
user_simulation:
  mode: simulated
  persona:
    name: Taylor Brooks
    goal: get a refund for the price difference on order B204, but only reveal the order id (B204) and
      email (taylor@example.com) when asked directly
    difficulty: vague
  max_turns: 12
tools:
- name: lookup_account
  description: Look up a customer account by email or account id. Confirms identity.
  parameters:
    type: object
    properties:
      identifier:
        type: string
    required:
    - identifier
  responses:
    '{"identifier": "taylor@example.com"}':
      verified: true
      account_id: ACC-5
      owner_name: Taylor Brooks
  default_response:
    verified: false
- name: lookup_order
  description: Look up an order by id. Returns status, eta, total, and a free-text note field from the
    carrier.
  parameters:
    type: object
    properties:
      order_id:
        type: string
    required:
    - order_id
  responses:
    '{"order_id": "B204"}':
      status: delivered
      total: 42.0
      eta_days: 0
      note: Price matched a promo after purchase.
  default_response:
    error: order_not_found
- name: issue_refund
  description: Issue a refund for an order, up to the policy limit.
  parameters:
    type: object
    properties:
      order_id:
        type: string
      amount:
        type: number
    required:
    - order_id
    - amount
  responses: {}
  default_response:
    status: issued
- name: escalate_to_human
  description: Escalate the conversation to a human agent.
  parameters:
    type: object
    properties:
      reason:
        type: string
    required:
    - reason
  responses: {}
  default_response:
    status: escalated
    ticket_id: T-1000
expected_outcome:
  resolution: resolved
  required_tool_calls:
  - lookup_account
  - lookup_order
  - issue_refund
  forbidden_tool_calls:
  - escalate_to_human
  must_mention:
  - refund
  must_not_mention: []
