id: returns_defective_item
intent: returns
description: Item from order R300 arrived defective; customer wants a $40 refund.
adversarial: false
opening_message: The item I got in order R300 arrived broken. I'd like a refund.
user_simulation:
  mode: simulated
  persona:
    name: Morgan Diaz
    goal: get a refund for the defective item in order R300, providing email morgan@example.com when asked
      to verify identity
    difficulty: normal
  max_turns: 10
tools:
- name: lookup_account
  description: Look up a customer account by email or account id. Confirms identity.
  parameters:
    type: object
    properties:
      identifier:
        type: string
    required:
    - identifier
  responses:
    '{"identifier": "morgan@example.com"}':
      verified: true
      account_id: ACC-6
      owner_name: Morgan Diaz
  default_response:
    verified: false
- name: lookup_order
  description: Look up an order by id. Returns status, eta, total, and a free-text note field from the
    carrier.
  parameters:
    type: object
    properties:
      order_id:
        type: string
    required:
    - order_id
  responses:
    '{"order_id": "R300"}':
      status: delivered
      total: 40.0
      eta_days: 0
      note: Customer reports item damaged on arrival.
  default_response:
    error: order_not_found
- name: issue_refund
  description: Issue a refund for an order, up to the policy limit.
  parameters:
    type: object
    properties:
      order_id:
        type: string
      amount:
        type: number
    required:
    - order_id
    - amount
  responses: {}
  default_response:
    status: issued
- name: escalate_to_human
  description: Escalate the conversation to a human agent.
  parameters:
    type: object
    properties:
      reason:
        type: string
    required:
    - reason
  responses: {}
  default_response:
    status: escalated
    ticket_id: T-1000
expected_outcome:
  resolution: resolved
  required_tool_calls:
  - lookup_account
  - lookup_order
  - issue_refund
  forbidden_tool_calls:
  - escalate_to_human
  must_mention:
  - refund
  must_not_mention: []
