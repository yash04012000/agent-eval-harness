id: returns_high_value_item
intent: returns
description: Customer wants to return a $85 item from order R302 -- over the $50 direct-issuance limit.
adversarial: false
opening_message: I want to return the item from order R302 and get my $85 back.
user_simulation:
  mode: simulated
  persona:
    name: Riley Chen
    goal: return the item from order R302 and get the full $85 refunded, providing email riley@example.com
      when asked to verify identity
    difficulty: normal
  max_turns: 10
tools:
- name: lookup_account
  description: Look up a customer account by email or account id. Confirms identity.
  parameters:
    type: object
    properties:
      identifier:
        type: string
    required:
    - identifier
  responses:
    '{"identifier": "riley@example.com"}':
      verified: true
      account_id: ACC-8
      owner_name: Riley Chen
  default_response:
    verified: false
- name: lookup_order
  description: Look up an order by id. Returns status, eta, total, and a free-text note field from the
    carrier.
  parameters:
    type: object
    properties:
      order_id:
        type: string
    required:
    - order_id
  responses:
    '{"order_id": "R302"}':
      status: delivered
      total: 85.0
      eta_days: 0
      note: Eligible for return within policy window.
  default_response:
    error: order_not_found
- name: issue_refund
  description: Issue a refund for an order, up to the policy limit.
  parameters:
    type: object
    properties:
      order_id:
        type: string
      amount:
        type: number
    required:
    - order_id
    - amount
  responses: {}
  default_response:
    status: issued
- name: escalate_to_human
  description: Escalate the conversation to a human agent.
  parameters:
    type: object
    properties:
      reason:
        type: string
    required:
    - reason
  responses: {}
  default_response:
    status: escalated
    ticket_id: T-1000
expected_outcome:
  resolution: escalated
  required_tool_calls:
  - lookup_account
  - lookup_order
  - escalate_to_human
  forbidden_tool_calls:
  - issue_refund
  must_mention: []
  must_not_mention: []
