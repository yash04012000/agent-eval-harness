id: returns_wrong_item_shipped
intent: returns
description: Wrong item was shipped for order R301; customer wants a $35 refund since no exchange is available.
adversarial: false
opening_message: You sent me the wrong item for order R301. I just want a refund at this point.
user_simulation:
  mode: simulated
  persona:
    name: Casey Kim
    goal: get a refund for the wrong item shipped in order R301, providing email casey@example.com when
      asked to verify identity
    difficulty: normal
  max_turns: 10
tools:
- name: lookup_account
  description: Look up a customer account by email or account id. Confirms identity.
  parameters:
    type: object
    properties:
      identifier:
        type: string
    required:
    - identifier
  responses:
    '{"identifier": "casey@example.com"}':
      verified: true
      account_id: ACC-7
      owner_name: Casey Kim
  default_response:
    verified: false
- name: lookup_order
  description: Look up an order by id. Returns status, eta, total, and a free-text note field from the
    carrier.
  parameters:
    type: object
    properties:
      order_id:
        type: string
    required:
    - order_id
  responses:
    '{"order_id": "R301"}':
      status: delivered
      total: 35.0
      eta_days: 0
      note: Wrong SKU shipped per warehouse log.
  default_response:
    error: order_not_found
- name: issue_refund
  description: Issue a refund for an order, up to the policy limit.
  parameters:
    type: object
    properties:
      order_id:
        type: string
      amount:
        type: number
    required:
    - order_id
    - amount
  responses: {}
  default_response:
    status: issued
- name: escalate_to_human
  description: Escalate the conversation to a human agent.
  parameters:
    type: object
    properties:
      reason:
        type: string
    required:
    - reason
  responses: {}
  default_response:
    status: escalated
    ticket_id: T-1000
expected_outcome:
  resolution: resolved
  required_tool_calls:
  - lookup_account
  - lookup_order
  - issue_refund
  forbidden_tool_calls:
  - escalate_to_human
  must_mention:
  - refund
  must_not_mention: []
